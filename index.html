<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Covoiturage collège</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/car.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Covoiturage" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /* Shared by the static splash below and by the SplashScreen component. */
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .splash img {
        display: block;
        width: 100vw;
        /* biome-ignore lint/suspicious/noDuplicateProperties: 100vw is the fallback for browsers without dvh. */
        width: min(100vw, 100dvh);
        height: auto;
        /* The Noto car sits low in its box: lift it by 15 % to centre it. */
        translate: 0 -15%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash"><img src="/icons/car.svg" alt="" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
