name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Sur une PR, un nouveau push rend le run precedent inutile. Sur main, jamais :
# annuler le run de la fusion d'une PR de release couperait la release et le
# deploiement en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Release Please calcule la prochaine version a partir des types de commit.
  # La fusion se fait en rebase : chaque commit de la PR arrive sur main et
  # compte, donc on les controle tous, pas seulement le titre de la PR.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Sans cette garde, une Variable GitHub absente ou mal orthographiee
      # part en `undefined` dans le build : celui-ci reussit quand meme, le
      # dist/ est publie, et c'est src/env.ts qui leve au chargement, en
      # prod, page blanche, CI verte.
      - name: Verifier les Variables GitHub Firebase
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "Variable GitHub manquante ou vide : $name" >&2
              exit 1
            fi
          done
      # La connexion Google par redirection ne marche que si authDomain est le
      # domaine de l'application, dont _redirects relaie /__/auth et /__/firebase.
      # Une autre valeur (ex. <projet>.firebaseapp.com) casserait toute nouvelle
      # connexion en production. Echouer ici bloque le deploy : la production
      # precedente reste en ligne.
      - name: Verifier le domaine de connexion de production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        run: |
          if [ "$VITE_FIREBASE_AUTH_DOMAIN" != "covoiturage-college.netlify.app" ]; then
            echo "VITE_FIREBASE_AUTH_DOMAIN doit valoir covoiturage-college.netlify.app (valeur actuelle : $VITE_FIREBASE_AUTH_DOMAIN)" >&2
            exit 1
          fi
      # Vite fige les VITE_* dans le bundle au moment du build. Sans ces
      # variables ici, le dist/ publie par le job deploy partirait avec des
      # undefined et l'application ne demarrerait pas.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - run: npm run test:coverage
      # L'emulateur Firestore tourne sur la JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules
      # TNR : Chromium seul, sur les emulateurs Auth et Firestore (meme JVM que
      # test:rules). Le build e2e sort dans dist-e2e/ et ne touche pas dist/.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Dernier controle avant publication : le dist/ deploye ne doit contenir
      # aucune trace des emulateurs (127.0.0.1, projet demo-covoiturage).
      - run: npm run check:bundle
      # Ce qui part en prod est ce bundle, pas un rebuild : le job deploy le
      # recupere tel quel.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # Apres les tests seulement : aucune version n'est publiee pour du code rouge.
  # A la fusion de la PR de release, Release Please cree le tag et la release
  # GitHub ; a tout autre push, il ouvre ou met a jour la PR de release.
  release:
    name: release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Livrer, c'est fusionner la PR de release : un push ordinaire ne deploie
  # plus rien. Le dist/ de verify a ete construit depuis le commit de release,
  # il porte donc la version qui vient d'etre publiee.
  deploy:
    name: deploy
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # En premier : checkout nettoie le workspace. Place apres le telechargement
      # de l'artefact, il effacerait le dist/ qu'on vient de recuperer. Il n'est
      # la que pour donner acces au .nvmrc.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # --no-build : Netlify ne construit rien ici, il recoit un dist/ deja bati.
      - run: npx --yes netlify-cli@27 deploy --prod --dir=dist --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
